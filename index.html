<title>Азбука Акрила — Каталог</title>

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="logo.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --bg:#f4f6f4; --panel:#fff; --accent:#559c51; --accent-light:#6bb867;
    --text:#1a1c19; --muted:#6c706c; --border:#e0e3e0;
    --thumb-bg:#f4f6f4; --subtab-bg:#e4e7e4;
    --skeleton:#e6e9e6; --skeleton-shine:#f1f3f1;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  body.locked{overflow:hidden;}

  /* ШАПКА */
  .header{padding:12px 15px 8px; text-align:center; flex-shrink:0; display:flex; flex-direction:column; align-items:center; position:relative; z-index:20; background:var(--bg);}
  .site-logo{height:45px; width:auto; object-fit:contain; margin-bottom:10px;}

  .tabs{display:flex; gap:8px; justify-content:flex-start; margin-top:5px;
    overflow-x:auto; padding:0 5px 5px; width:100%;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:8px 16px; border-radius:20px; cursor:pointer; white-space:nowrap;
    border:1px solid var(--border); background:transparent; color:var(--muted);
    font-size:13px; transition:all .3s ease;}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);
    font-weight:600; box-shadow:0 4px 12px rgba(85,156,81,.3);}

  /* ПОДРУБРИКИ */
  .sub-tabs-wrap{display:none; width:100%; margin-top:10px;}
  .sub-tabs-wrap.show{display:block; animation:fadeIn .3s ease;}
  .sub-hint{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em;
    text-align:left; padding:0 4px 6px; text-transform:uppercase;}
  .sub-tabs{display:flex; gap:4px; justify-content:flex-start;
    overflow-x:auto; padding:4px; width:100%;
    background:var(--subtab-bg); border-radius:12px;
    position:relative; scroll-behavior:smooth;}
  .sub-tabs::-webkit-scrollbar{display:none;}
  .sub-tabs::after{content:''; position:absolute; right:0; top:0; bottom:0; width:28px;
    background:linear-gradient(to left, var(--subtab-bg), transparent);
    pointer-events:none; border-radius:0 12px 12px 0;}
  .sub-tab{padding:8px 16px; border-radius:9px; cursor:pointer; white-space:nowrap;
    border:none; background:transparent; color:var(--muted);
    font-size:14px; font-weight:600; transition:all .25s ease;}
  .sub-tab.active{background:#fff; color:var(--accent);
    box-shadow:0 2px 6px rgba(0,0,0,.08);}

  @keyframes fadeIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}

  /* ОСНОВНОЙ БЛОК */
  .main-content{flex-grow:1; display:flex; flex-direction:column; padding:8px 12px; gap:10px; overflow:hidden; position:relative;}

  .drawing-box{background:var(--panel); border-radius:12px; padding:6px 10px;
    height:20vh; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    flex-shrink:0; position:relative; border:1px solid var(--border);
    border-top:4px solid var(--accent); box-shadow:0 4px 15px rgba(0,0,0,.05);
    transition:height .3s ease, transform .3s ease, opacity .25s ease; touch-action:pan-y;
    cursor: zoom-in;}
  .drawing-img{width:100%; height:calc(100% - 20px); object-fit:contain; transition:opacity .2s ease; pointer-events: none;}
  .drawing-info{text-align:center; color:var(--text); font-size:14px; font-weight:700;
    width:100%; line-height:1.1; padding-top:4px;}

  .photo-box{background:var(--bg); border-radius:12px; flex-grow:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; border:1px solid var(--border);
    min-height:200px; touch-action:pan-y;
    transition:opacity .25s ease, transform .25s ease;}
  .photo-img{width:100%; height:100%; object-fit:contain; cursor:zoom-in;
    opacity:1; transition:opacity .2s ease;}

  /* SKELETON */
  .skeleton{
    position:absolute; inset:0;
    background:linear-gradient(90deg, var(--skeleton) 25%, var(--skeleton-shine) 50%, var(--skeleton) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s linear infinite;
    display:none; z-index:4; border-radius:12px;
  }
  .skeleton.show{display:block;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}

  .main-content.switching .drawing-img,
  .main-content.switching .photo-img{opacity:0; transform:translateY(6px);}

  .main-content.single-view .photo-box{display:none !important;}
  .main-content.single-view .drawing-box{height:100%; flex-grow:1; padding:20px 15px;
    border-top:6px solid var(--accent);}
  .main-content.single-view .drawing-img{height:calc(100% - 30px);}
  .main-content.photo-only .drawing-box{display:none !important;}
  .main-content.photo-only .photo-box{width:100%; height:100%;}

  .nav-btn{position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px;
    background:rgba(0,0,0,.4); border:none; border-radius:50%; color:#fff; font-size:16px;
    cursor:pointer; display:none; align-items:center; justify-content:center; z-index:10;
    transition:all .2s; backdrop-filter:blur(2px);}
  .nav-btn:active{background:rgba(0,0,0,.8);}
  .nav-btn.show{display:flex;}
  .nav-prev{left:8px;} .nav-next{right:8px;}

  .photo-counter{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff;
    font-size:11px; padding:2px 8px; border-radius:8px; display:none; z-index:10;}
  .photo-counter.show{display:block;}
  .dots{position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    display:none; gap:6px; z-index:10;}
  .dots.show{display:flex;}
  .dot{width:6px; height:6px; border-radius:50%; background:rgba(0,0,0,.2); transition:background .3s;}
  .dot.active{background:var(--accent);}

  /* ЛЕНТА */
  .model-strip{flex-shrink:0; padding:12px 12px calc(30px + env(safe-area-inset-bottom));
    display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-top:1px solid var(--border);}
  .model-strip::-webkit-scrollbar{display:none;}
  .model-thumb{flex:0 0 70px; height:70px; border-radius:10px; background:var(--thumb-bg);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    border:2px solid transparent; transition:all .2s ease; overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.05);}
  .model-thumb img{width:100%; height:100%; object-fit:contain; padding:4px;}
  .model-thumb.active{border-color:var(--accent); background:var(--panel);
    transform:translateY(-2px); box-shadow:0 4px 10px rgba(85,156,81,.25);}
  .model-thumb span{font-size:12px; color:var(--text); font-weight:700; text-align:center;
    line-height:1.1; padding:2px;}

  /* STICKY ЗАГОЛОВОК МОДЕЛИ */
  .model-sticky{
    position:absolute; top:8px; left:50%; transform:translateX(-50%) translateY(-120%);
    background:var(--panel); color:var(--text); font-size:12px; font-weight:600;
    padding:6px 14px; border-radius:20px; box-shadow:0 4px 14px rgba(0,0,0,.12);
    z-index:30; transition:transform .25s ease, opacity .25s ease; opacity:0;
    pointer-events:none; max-width:90%; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; border:1px solid var(--border);
  }
  .model-sticky.show{transform:translateX(-50%) translateY(0); opacity:1;}

  /* ЛАЙТБОКС на <dialog> */
  dialog.lightbox{
    padding:0; border:none; background:transparent;
    width:100vw; height:100dvh; max-width:100vw; max-height:100dvh;
    margin:0;
  }
  dialog.lightbox::backdrop{
    background:rgba(0,0,0,.96);
    animation:lbFade .2s ease;
  }
  dialog.lightbox[open]{animation:lbFade .2s ease;}
  @keyframes lbFade{from{opacity:0;}to{opacity:1;}}

  .lb-inner{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none;}
  .lightbox-img{max-width:100%; max-height:100%; object-fit:contain;
    transition:transform .25s cubic-bezier(.2,.8,.2,1); will-change:transform;
    transform-origin:center center; user-select:none; -webkit-user-drag:none;}
  .lightbox-img.dragging{transition:none;}

  .lb-close{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px;
    width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.15);
    color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:1002; backdrop-filter:blur(4px);}
  .lb-close:active{background:rgba(255,255,255,.3);}
  .lb-counter{position:absolute; top:calc(20px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); color:#fff; font-size:13px; padding:4px 12px;
    border-radius:10px; background:rgba(0,0,0,.5); z-index:1002;}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px;
    border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff;
    font-size:24px; cursor:pointer; display:none; align-items:center; justify-content:center;
    z-index:1002; backdrop-filter:blur(4px);}
  .lb-nav.show{display:flex;}
  .lb-prev{left:12px;} .lb-next{right:12px;}
  .lb-nav:active{background:rgba(255,255,255,.3);}
  .lb-dots{position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%); display:flex; gap:8px; z-index:1002;}
  .lb-dot{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); transition:background .3s;}
  .lb-dot.active{background:var(--accent-light);}

  @media (min-width:768px){
    .site-logo{height:70px;}
    .tabs{justify-content:center;}
    .sub-tabs-wrap{max-width:720px; margin-left:auto; margin-right:auto;}
    .sub-tabs{justify-content:center;}
    .sub-hint{text-align:center;}
    .main-content{flex-direction:row; padding:20px; gap:20px; height:calc(100vh - 170px);}
    .drawing-box{width:25%; height:100%; padding:15px 10px; border-top:1px solid var(--border);
      border-left:6px solid var(--accent);}
    .drawing-info{font-size:16px;}
    .photo-box{width:75%; height:100%;}
    .main-content.single-view .drawing-box{width:100%; border-left:none; border-top:6px solid var(--accent);}
    .main-content.photo-only .photo-box{width:100%; height:100%;}
    .model-strip{padding:15px 20px; justify-content:center; border-radius:16px; margin:0 20px 20px;
      border:1px solid var(--border);}
    .model-thumb{flex:0 0 80px; height:80px;}
    .nav-btn{width:36px; height:36px; font-size:18px; background:rgba(0,0,0,.5);}
    .nav-btn:hover{background:var(--accent);}
    .model-sticky{top:12px; font-size:13px; padding:8px 18px;}
  }
</style>
</head>
<body>

  <div class="header">

      <div id="dots" class="dots"></div>
      <button class="nav-btn nav-prev" id="btnPrev" aria-label="Предыдущее фото">‹</button>
      <button class="nav-btn nav-next" id="btnNext" aria-label="Следующее фото">›</button>
    </div>
  </div>

  <div class="model-strip" id="modelStrip"></div>

  <dialog class="lightbox" id="lightbox" aria-label="Просмотр фото">
    <div class="lb-inner" id="lbStage">

    </div>
    <button class="lb-close" id="lbClose" aria-label="Закрыть">✕</button>
    <div class="lb-counter" id="lbCounter"></div>

  const photoEl=document.getElementById('photo'), counterEl=document.getElementById('counter');
  const btnPrev=document.getElementById('btnPrev'), btnNext=document.getElementById('btnNext');
  const photoBox=document.getElementById('photoBox');
  const dotsEl=document.getElementById('dots');
  const skDrawing=document.getElementById('skeletonDrawing');
  const skPhoto=document.getElementById('skeletonPhoto');
  const modelSticky=document.getElementById('modelSticky');

  const lightbox=document.getElementById('lightbox');
  const lbImg=document.getElementById('lbImg');
  const lbStage=document.getElementById('lbStage');
  const lbClose=document.getElementById('lbClose');
  const lbCounter=document.getElementById('lbCounter');
  const lbPrev=document.getElementById('lbPrev');
  const lbNext=document.getElementById('lbNext');
  const lbDots=document.getElementById('lbDots');

  const withVersion = url => url ? (VERSION ? url + '?v=' + VERSION : url) : url;
  const getModel = () => (DATA[currentCat].subcats[currentSubCat].models || [])[currentModel];
  const getPhotos = () => { const m = getModel(); return (m && m.photos) ? m.photos : []; };

  let currentPhotoSrc = '';
  let lbMode = 'models';

  function haptic(ms=8){
    if (navigator.vibrate) { try{ navigator.vibrate(ms); }catch(e){} }
  }

  function showSkeleton(el){ if(el) el.classList.add('show'); }
  function hideSkeleton(el){ if(el) el.classList.remove('show'); }

  function buildHash(){
    const cat=DATA[currentCat], sub=cat.subcats[currentSubCat];
    const m=(sub.models||[])[currentModel];
    if(!m) return '';
    return `#${cat.id}/${sub.id}/${m.id}`;
  }
  function updateHash(replace=false){
    const h=buildHash();
    if(!h) return;
    if(location.hash===h) return;
    if(replace) history.replaceState(null,'',h);
    else history.pushState(null,'',h);
  }
  function applyHash(){
    const hash=location.hash.replace(/^#/,'');
    if(!hash) return false;
    const parts=hash.split('/');
    if(parts.length<2) return false;
    const [catId, subId, modelId]=parts;
    const ci=DATA.findIndex(c=>c.id===catId);
    if(ci<0) return false;
    const si=DATA[ci].subcats.findIndex(s=>s.id===subId);
    if(si<0) return false;
    let mi=0;
    if(modelId){
      const found=DATA[ci].subcats[si].models.findIndex(m=>m.id===modelId);
      if(found>=0) mi=found;
    }
    currentCat=ci; currentSubCat=si; currentModel=mi; currentPhoto=0; currentPhotoSrc='';
    return true;
  }

  const preloaded = new Set();
  function preloadNeighborPhotos(){
    const photos=getPhotos();
    if(photos.length<2) return;
    const idx=[(currentPhoto+1)%photos.length, (currentPhoto-1+photos.length)%photos.length];
    idx.forEach(i=>{
      const url=withVersion(photos[i]);
      if(preloaded.has(url)) return;
      preloaded.add(url);
      const img=new Image();
      img.decoding='async';
      img.src=url;
    });
  }

  function syncDots(container,total,activeIdx,cls){
    while(container.children.length<total){ const d=document.createElement('div'); d.className=cls; container.appendChild(d); }
    while(container.children.length>total){ container.removeChild(container.lastChild); }
    Array.from(container.children).forEach((d,i)=>{ d.className=cls+(i===activeIdx?' active':''); });
  }

  function renderTabs(){
    tabsEl.innerHTML='';
    DATA.forEach((cat,i)=>{
      const btn=document.createElement('div');
      btn.className='tab'+(i===currentCat?' active':'');
      btn.textContent=cat.title;
      btn.onclick=()=>{
        haptic();
        currentCat=i; currentSubCat=0; currentModel=0; currentPhoto=0; currentPhotoSrc='';
        renderTabs(); renderSubTabs(); renderModels(); updateView(); updateHash();
        btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderSubTabs(){
    subTabsEl.innerHTML='';
    const subcats=DATA[currentCat].subcats;
    if(subcats.length>1){
      subTabsWrapEl.classList.add('show');
      if(DATA[currentCat].id==='mojki') subHintEl.textContent='Выберите тип мойки:';
      else if(DATA[currentCat].id==='galereya') subHintEl.textContent='Выберите раздел галереи:';
      else subHintEl.textContent='Выберите раздел:';
      subcats.forEach((sub,i)=>{
        const btn=document.createElement('div');
        btn.className='sub-tab'+(i===currentSubCat?' active':'');
        btn.textContent=sub.name;
        btn.onclick=()=>{
          haptic();
          currentSubCat=i; currentModel=0; currentPhoto=0; currentPhotoSrc='';
          renderSubTabs(); renderModels(); updateView(); updateHash();
          btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
        };
        subTabsEl.appendChild(btn);
      });
    } else {
      subTabsWrapEl.classList.remove('show');
    }
  }

  function renderModels(){
    stripEl.innerHTML='';
    const subcat=DATA[currentCat].subcats[currentSubCat];
    if(subcat.hideStrip || !subcat.models || subcat.models.length<=1){ stripEl.style.display='none'; return; }
    stripEl.style.display='flex';
    subcat.models.forEach((model,i)=>{
      const div=document.createElement('div');
      div.className='model-thumb'+(i===currentModel?' active':'');
      if(model.drawing){
        const img=document.createElement('img');
        img.loading='lazy';
        img.decoding='async';
        img.alt=model.name;
        img.src=withVersion(model.drawing);
        img.onerror=()=>{ img.remove(); div.innerHTML=`<span>${model.name}</span>`; };
        div.appendChild(img);
      } else if(model.photos && model.photos.length){
        const img=document.createElement('img');
        img.loading='lazy';
        img.decoding='async';
        img.alt=model.name;
        img.src=withVersion(model.photos[0]);
        img.onerror=()=>{ img.remove(); div.innerHTML=`<span>${model.name}</span>`; };
        div.appendChild(img);
      } else div.innerHTML=`<span>${model.name}</span>`;
      div.onclick=()=>{
        if(i===currentModel) return;
        haptic();
        currentModel=i; currentPhoto=0; currentPhotoSrc='';
        renderModels(); updateView(); updateHash();
        div.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
      };
      stripEl.appendChild(div);
    });
  }

  function loadPhoto(url){
    showSkeleton(skPhoto);
    photoEl.style.opacity='0';

    if(url === currentPhotoSrc && photoEl.complete && photoEl.naturalWidth>0){
      hideSkeleton(skPhoto);
      photoEl.style.opacity='1';
      return;
    }

    currentPhotoSrc=url;
    photoEl.onload = () => {
      hideSkeleton(skPhoto);
      photoEl.style.display='block';
      photoEl.style.opacity='1';
      preloadNeighborPhotos();
    };
    photoEl.onerror = () => {
      hideSkeleton(skPhoto);
      photoEl.style.display='none';
      photoEl.alt='Не удалось загрузить фото';
    };
    photoEl.decoding='async';
    photoEl.src=url;
  }

  function switchAnimation(){
    mainContentEl.classList.add('switching');
    setTimeout(()=>mainContentEl.classList.remove('switching'),180);
  }

  function updateView(animate=false){
    const model=getModel();
    const photosOnly = !!DATA[currentCat].photosOnly;

    if(!model){
      drawEl.removeAttribute('src'); infoEl.textContent='Модели скоро появятся';
      photoEl.removeAttribute('src');
      mainContentEl.className='main-content single-view';
      drawingBoxEl.style.display='flex'; photoBox.style.display='none';
      hideSkeleton(skDrawing); hideSkeleton(skPhoto);
      modelSticky.classList.remove('show');
      return;
    }
    if(animate) switchAnimation();

    mainContentEl.className='main-content';
    infoEl.textContent=model.name;
    modelSticky.textContent=model.name;

    if(photosOnly) modelSticky.classList.add('show');

    const hasDrawing = !photosOnly && !!(model.drawing && model.drawing.trim());
    const hasPhotos = !!(model.photos && model.photos.length);

    if(hasDrawing){
      drawingBoxEl.style.display='flex'; drawEl.style.display='block';
      drawEl.alt='Чертёж: '+model.name;
      const drawUrl=withVersion(model.drawing);
      if(drawEl.src !== drawUrl){
        showSkeleton(skDrawing);
        drawEl.style.opacity='0';
        drawEl.onload=()=>{ hideSkeleton(skDrawing); drawEl.style.display='block'; drawEl.style.opacity='1'; };
        drawEl.onerror=()=>{ hideSkeleton(skDrawing); drawEl.style.display='none'; };
        drawEl.decoding='async';
        drawEl.src=drawUrl;
      } else {
        hideSkeleton(skDrawing);
        drawEl.style.opacity='1';
      }
    } else {
      drawingBoxEl.style.display='none';
      hideSkeleton(skDrawing);
    }

    if(hasPhotos){
      photoBox.style.display='flex';
      showSkeleton(skPhoto);
      photoEl.alt=`Фото: ${model.name} (${currentPhoto+1} из ${model.photos.length})`;
      loadPhoto(withVersion(model.photos[currentPhoto]));

      if(model.photos.length>1){
        btnPrev.classList.add('show'); btnNext.classList.add('show');
        counterEl.classList.add('show'); counterEl.textContent=`${currentPhoto+1} / ${model.photos.length}`;
        dotsEl.classList.add('show'); syncDots(dotsEl,model.photos.length,currentPhoto,'dot');
      } else {
        btnPrev.classList.remove('show'); btnNext.classList.remove('show');
        counterEl.classList.remove('show'); dotsEl.classList.remove('show'); dotsEl.innerHTML='';
      }
    } else {
      photoBox.style.display='none';
      photoEl.removeAttribute('src');
      currentPhotoSrc='';
      btnPrev.classList.remove('show'); btnNext.classList.remove('show');
      counterEl.classList.remove('show'); dotsEl.classList.remove('show'); dotsEl.innerHTML='';
      hideSkeleton(skPhoto);
    }

    if(photosOnly){
      mainContentEl.classList.add('photo-only');
    } else if(hasDrawing && !hasPhotos){
      mainContentEl.classList.add('single-view');
    } else if(!hasDrawing && hasPhotos){
      mainContentEl.classList.add('photo-only');
    }
  }

  function changePhoto(dir){
    const photos=getPhotos();
    if(photos.length<=1) return;
    haptic();
    currentPhoto=(currentPhoto+dir+photos.length)%photos.length;
    updateView();
  }

  function changeModel(dir){
    const models = DATA[currentCat].subcats[currentSubCat].models || [];
    if(models.length<=1) return;
    haptic();
    currentModel = (currentModel + dir + models.length) % models.length;
    currentPhoto = 0; currentPhotoSrc = '';
    renderModels(); updateView(); updateHash();
  }

  btnPrev.onclick=()=>changePhoto(-1);
  btnNext.onclick=()=>changePhoto(1);

  /* ===== СВАЙП В КАТАЛОГЕ ===== */
  let tStartX=0,tStartY=0;

  drawingBoxEl.addEventListener('touchstart',e=>{
    tStartX=e.changedTouches[0].clientX; tStartY=e.changedTouches[0].clientY;
  },{passive:true});
  drawingBoxEl.addEventListener('touchend',e=>{
    handleMainSwipe(tStartX, tStartY, e.changedTouches[0].clientX, e.changedTouches[0].clientY, true);
  },{passive:true});

  photoBox.addEventListener('touchstart',e=>{
    tStartX=e.changedTouches[0].clientX; tStartY=e.changedTouches[0].clientY;
  },{passive:true});
  photoBox.addEventListener('touchend',e=>{
    handleMainSwipe(tStartX, tStartY, e.changedTouches[0].clientX, e.changedTouches[0].clientY, false);
  },{passive:true});

  function handleMainSwipe(startX, startY, endX, endY, isDrawingZone){
    const dx=endX-startX;
    const dy=endY-startY;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.5){
      if (isDrawingZone) {
        changeModel(dx<0?1:-1);
      } else {
        const photos = getPhotos();
        if (photos.length > 1) changePhoto(dx<0?1:-1);
        else changeModel(dx<0?1:-1);
      }
    }
  }

  /* ===== STICKY ЗАГОЛОВОК ===== */
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(DATA[currentCat].photosOnly) return;
      if(!en.isIntersecting && en.boundingClientRect.top<0){
        modelSticky.classList.add('show');
      } else {
        modelSticky.classList.remove('show');
      }
    });
  },{threshold:0});
  observer.observe(drawingBoxEl);

  /* ===== ЛАЙТБОКС ===== */
  let lbScale=1, lbX=0, lbY=0;
  const MIN_SCALE=1, MAX_SCALE=4;
  function applyLbTransform(){ lbImg.style.transform=`translate(${lbX}px, ${lbY}px) scale(${lbScale})`; }
  function resetLbTransform(){
    lbScale=1; lbX=0; lbY=0; lbImg.classList.add('dragging'); applyLbTransform();
    requestAnimationFrame(()=>lbImg.classList.remove('dragging'));
  }

  function openLightbox(type){
    haptic();
    lbMode = type;
    lightbox.showModal();
    document.body.classList.add('locked');

    if (lbMode === 'models') {
      const m = getModel();
      lbImg.src = withVersion(m.drawing);
      updateLightboxNav();
    } else {
      lbImg.src = withVersion(getPhotos()[currentPhoto]);
      updateLightboxNav();
    }

    resetLbTransform();
    history.pushState({lightbox:true},'',location.hash);
  }

  function updateLightboxNav() {
    if (lbMode === 'models') {
      const models = DATA[currentCat].subcats[currentSubCat].models || [];
      const m = getModel();
      lbCounter.textContent = m.name;
      if (models.length > 1) {
        lbPrev.classList.add('show'); lbNext.classList.add('show');
        syncDots(lbDots, models.length, currentModel, 'lb-dot');
      } else {
        lbPrev.classList.remove('show'); lbNext.classList.remove('show');
        lbDots.innerHTML = '';
      }
    } else {
      const photos = getPhotos();
      lbCounter.textContent = `${currentPhoto + 1} / ${photos.length}`;
      if (photos.length > 1) {
        lbPrev.classList.add('show'); lbNext.classList.add('show');
        syncDots(lbDots, photos.length, currentPhoto, 'lb-dot');
      } else {
        lbPrev.classList.remove('show'); lbNext.classList.remove('show');
        lbDots.innerHTML = '';
      }
    }
  }

  function closeLightbox(fromHistory=false){
    if(lightbox.open) lightbox.close();
    document.body.classList.remove('locked');
    if(!fromHistory && history.state && history.state.lightbox){
      history.back();
    }
  }

  lbClose.onclick=()=>closeLightbox();

  function lbChange(dir){
    if (lbMode === 'models') {
      const models = DATA[currentCat].subcats[currentSubCat].models || [];
      if(models.length<=1) return;
      changeModel(dir);
      const m = getModel();
      if(m.drawing) lbImg.src = withVersion(m.drawing);
      updateLightboxNav();
    } else {
      const photos = getPhotos();
      if(photos.length<=1) return;
      currentPhoto = (currentPhoto + dir + photos.length) % photos.length;
      updateView();
      lbImg.src = withVersion(photos[currentPhoto]);
      updateLightboxNav();
    }
    resetLbTransform();
  }

  lbPrev.onclick=()=>lbChange(-1);
  lbNext.onclick=()=>lbChange(1);

  lightbox.addEventListener('cancel',e=>{ e.preventDefault(); closeLightbox(); });
  lightbox.addEventListener('click',e=>{ if(e.target===lightbox) closeLightbox(); });

  photoEl.addEventListener('click',()=>{ if(getPhotos().length) openLightbox('photos'); });
  drawingBoxEl.addEventListener('click',()=>{
    if(DATA[currentCat].photosOnly) return;
    const m = getModel();
    if(m && m.drawing) openLightbox('models');
  });

  let lbTouchStartX=0, lbTouchStartY=0, lbTouchStartTime=0;
  let lbPinchStartDist=0, lbPinchStartScale=1;
  let lbIsDragging=false, lbDragStartX=0, lbDragStartY=0;
  let lbLastTap=0;

  function getDist(touches){
    const dx=touches[0].clientX-touches[1].clientX;
    const dy=touches[0].clientY-touches[1].clientY;
    return Math.hypot(dx,dy);
  }

  lightbox.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      lbPinchStartDist=getDist(e.touches);
      lbPinchStartScale=lbScale;
    } else if(e.touches.length===1){
      lbTouchStartX=e.touches[0].clientX;
      lbTouchStartY=e.touches[0].clientY;
      lbTouchStartTime=Date.now();
      lbDragStartX=lbX; lbDragStartY=lbY;
      lbIsDragging=false;
    }
  },{passive:true});

  lightbox.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const dist=getDist(e.touches);
      if(lbPinchStartDist>0){
        lbScale=Math.min(MAX_SCALE,Math.max(MIN_SCALE,(dist/lbPinchStartDist)*lbPinchStartScale));
        lbImg.classList.add('dragging');
        applyLbTransform();
      }
    } else if(e.touches.length===1 && lbScale>1){
      e.preventDefault();
      const dx=e.touches[0].clientX-lbTouchStartX;
      const dy=e.touches[0].clientY-lbTouchStartY;
      if(Math.abs(dx)>4||Math.abs(dy)>4) lbIsDragging=true;
      lbX=lbDragStartX+dx; lbY=lbDragStartY+dy;
      lbImg.classList.add('dragging');
      applyLbTransform();
    }
  },{passive:false});

  lightbox.addEventListener('touchend',e=>{
    const now=Date.now();

    if(e.touches.length===0 && lbPinchStartDist>0){
      lbPinchStartDist=0;
      if(lbScale<1.05){ lbScale=1; lbX=0; lbY=0; }
      clampLbPan();
      lbImg.classList.remove('dragging');
      applyLbTransform();
      return;
    }

    if(e.changedTouches.length===1){
      const dx=e.changedTouches[0].clientX-lbTouchStartX;
      const dy=e.changedTouches[0].clientY-lbTouchStartY;
      const dt=now-lbTouchStartTime;
      const absX=Math.abs(dx), absY=Math.abs(dy);

      if(lbScale<=1.05 && dy>120 && absY>absX*1.5 && dt<500){ closeLightbox(); return; }
      if(lbScale<=1.05 && absX>60 && absX>absY*1.5 && dt<500){ lbChange(dx<0?1:-1); return; }

      if(absX<8 && absY<8 && dt<300){
        if(now-lbLastTap<300){
          if(lbScale>1){
            lbScale=1; lbX=0; lbY=0;
          } else {
            lbScale=2.5;
            const rect=lbStage.getBoundingClientRect();
            const cx=e.changedTouches[0].clientX-rect.left-rect.width/2;
            const cy=e.changedTouches[0].clientY-rect.top-rect.height/2;
            const maxX=(rect.width*(lbScale-1))/2;
            const maxY=(rect.height*(lbScale-1))/2;
            lbX=Math.max(-maxX,Math.min(maxX,-cx*(lbScale-1)));
            lbY=Math.max(-maxY,Math.min(maxY,-cy*(lbScale-1)));
          }
          lbImg.classList.add('dragging'); applyLbTransform();
          setTimeout(()=>lbImg.classList.remove('dragging'),250);
          lbLastTap=0;
        } else lbLastTap=now;
      }

      if(lbIsDragging && lbScale>1){ clampLbPan(); applyLbTransform(); }
      lbIsDragging=false;
    }
  },{passive:true});

  function clampLbPan(){
    if(lbScale<=1){ lbX=0; lbY=0; return; }
    const rect=lbStage.getBoundingClientRect();
    const maxX=(rect.width*(lbScale-1))/2;
    const maxY=(rect.height*(lbScale-1))/2;
    lbX=Math.max(-maxX,Math.min(maxX,lbX));
    lbY=Math.max(-maxY,Math.min(maxY,lbY));
  }

  lightbox.addEventListener('wheel',e=>{
    if(!lightbox.open) return;
    e.preventDefault();
    lbScale=Math.min(MAX_SCALE,Math.max(MIN_SCALE,lbScale+(e.deltaY<0?0.2:-0.2)));
    clampLbPan(); applyLbTransform();
  },{passive:false});

  /* ===== КЛАВИАТУРА ===== */
  document.addEventListener('keydown', e => {
    if (lightbox.open) {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); lbChange(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); lbChange(1); }
      if (e.key === 'Escape')     { e.preventDefault(); closeLightbox(); }
      return;
    }

    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;

    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const photos = getPhotos();
      if (photos.length > 1) changePhoto(dir);
      else changeModel(dir);
    }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      changeModel(e.key === 'ArrowDown' ? 1 : -1);
    }
  });

  window.addEventListener('popstate',e=>{
    if(lightbox.open){
      closeLightbox(true);
      return;
    }
    if(e.state && e.state.lightbox){
      history.replaceState(null,'',location.hash);
    }
  });

  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }

  applyHash();
  renderTabs(); renderSubTabs(); renderModels(); updateView();
  updateHash(true);

  window.addEventListener('hashchange',()=>{
    if(applyHash()){
      renderTabs(); renderSubTabs(); renderModels(); updateView();
    }
  });
</script>
</body>
</html>

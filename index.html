<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Азбука Акрила — Каталог</title>

<!-- Подключение фавикона -->
<link rel="icon" type="image/png" href="favicon.png">

<style>
  :root{ 
    --bg: #1a1c19;      /* Глубокий графитовый фон */
    --panel: #242622;   /* Цвет панелей (лента снизу) */
    --accent: #559c51;  /* Зеленый цвет из логотипа */
    --accent-light: #6bb867; 
    --text: #e8ebe6;    /* Светло-серый текст */
    --muted: #82867d; 
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  
  /* ===== ШАПКА ===== */
  .header { padding: 15px 15px 10px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  
  .site-logo {
    height: 50px; 
    width: auto;
    object-fit: contain;
    margin-bottom: 12px;
  }

  .tabs { 
    display: flex; gap: 8px; justify-content: flex-start; margin-top: 5px; 
    overflow-x: auto; padding-bottom: 5px; padding-left: 5px; padding-right: 5px;
    width: 100%; 
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap;
    border: 1px solid #3a3c36; background: transparent;
    color: var(--muted); font-size: 13px; transition: all 0.3s ease;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; box-shadow: 0 4px 12px rgba(85, 156, 81, 0.3); }

  /* ===== ОСНОВНОЙ БЛОК ===== */
  .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 8px 12px; gap: 12px; overflow: hidden; }
  
  /* Блок с чертежом (Карточка) */
  .drawing-box {
    background: #fff; border-radius: 12px; padding: 10px 10px 6px; 
    height: 22vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    flex-shrink: 0; position: relative;
    border-top: 4px solid var(--accent); /* Зеленая полоса сверху */
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .drawing-img { width: 100%; height: calc(100% - 24px); object-fit: contain; }
  .drawing-info { text-align: center; color: #333; font-size: 13px; font-weight: 700; width: 100%; line-height: 1.2; }
  
  /* Блок с живыми фото */
  .photo-box {
    background: #111; border-radius: 12px; flex-grow: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2a2c26;
  }
  .photo-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  
  /* Стрелки */
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
    background: rgba(85, 156, 81, 0.9); border: none; border-radius: 50%; color: #fff;
    font-size: 24px; font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center;
    z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--accent-light); transform: translateY(-50%) scale(1.05); }
  .nav-btn.show { display: flex; }
  .nav-prev { left: 12px; }
  .nav-next { right: 12px; }
  
  /* Счетчик и точки */
  .photo-counter {
    position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.8);
    color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 10px; display: none; z-index: 10;
    border: 1px solid #333;
  }
  .photo-counter.show { display: block; }
  .dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; z-index: 10; }
  .dots.show { display: flex; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
  .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ===== ЛЕНТА МОДЕЛЕЙ ===== */
  .model-strip {
    flex-shrink: 0; padding: 8px 12px 16px; display: flex; gap: 10px; overflow-x: auto;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    background: var(--panel); border-top: 1px solid #2a2c26;
  }
  .model-strip::-webkit-scrollbar { display: none; }
  .model-thumb {
    flex: 0 0 60px; height: 60px; border-radius: 10px; background: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .model-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .model-thumb:hover { transform: translateY(-2px); }
  .model-thumb.active { border-color: var(--accent); box-shadow: 0 4px 12px rgba(85, 156, 81, 0.4); }
  .model-thumb span { font-size: 11px; color: #333; font-weight: 700; }

  /* ===== ДЕСКТОПНАЯ ВЕРСИЯ ===== */
  @media (min-width: 768px) {
    .site-logo { height: 70px; } 
    .tabs { justify-content: center; }
    .main-content { flex-direction: row; padding: 20px; gap: 20px; height: calc(100vh - 160px); }
    .drawing-box { width: 25%; height: 100%; padding: 15px 10px; border-top: none; border-left: 6px solid var(--accent); } 
    .drawing-info { font-size: 16px; }
    .photo-box { width: 75%; height: 100%; }
    .model-strip { padding: 15px 20px; justify-content: center; border-radius: 16px; margin: 0 20px 20px; border: 1px solid #2a2c26; }
    .model-thumb { flex: 0 0 80px; height: 80px; }
  }
</style>
</head>
<body>

  <div class="header">
    <!-- Логотип. Если файла нет, покажется текст -->
    <img src="logo.png" alt="Азбука Акрила" class="site-logo" onerror="this.style.display='none'; document.getElementById('text-title').style.display='block';">
    <div id="text-title" style="display:none; font-size: 22px; font-weight: 600; margin-bottom: 10px; color: var(--accent);">Азбука Акрила</div>
    
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="main-content">
    <div class="drawing-box">
      <img id="drawing" class="drawing-img" src="" alt="Чертеж">
      <div id="info" class="drawing-info"></div>
    </div>

    <div class="photo-box" id="photoBox">
      <img id="photo" class="photo-img" src="" alt="Фото">
      <div id="counter" class="photo-counter"></div>
      <div id="dots" class="dots"></div>
      <button class="nav-btn nav-prev" id="btnPrev">‹</button>
      <button class="nav-btn nav-next" id="btnNext">›</button>
    </div>
  </div>

  <div class="model-strip" id="modelStrip"></div>

<script>
  const DATA = [
    {
      title: 'Раковины (Ванная)',
      models: [
        { name: 'Модель 201', size: '390×390×110 мм', drawing: 'draw-201.jpg', photos: ['photo-201-1.jpg'] },
        { name: 'Модель 202', size: '400×300×100 мм', drawing: 'draw-202.jpg', photos: ['photo-202-1.jpg'] },
        { name: 'Модель 203', size: '545×390×120 мм', drawing: 'draw-203.jpg', photos: ['photo-203-1.jpg'] },
        { name: 'Модель 204', size: '400×250×100 мм', drawing: 'draw-204.jpg', photos: [] },
        { name: 'Модель 205', size: '520×370×130 мм', drawing: 'draw-205.jpg', photos: ['photo-205-1.jpg'] },
        { name: 'Модель 205R', size: '620×370×130 мм', drawing: 'draw-205R.jpg', photos: [] },
        { name: 'Модель 206', size: '660×300×120 мм', drawing: 'draw-206.jpg', photos: [] },
        { name: 'Модель 210', size: '300-600×250-600×120 мм', drawing: 'draw-210.jpg', photos: [] },
        { name: 'Модель 211', size: '300-600×250-600×120 мм', drawing: 'draw-211.jpg', photos: [] }
      ]
    },
    {
      title: 'Кухонные мойки',
      models: [
        { name: 'Модель 413', size: '410×380×180 мм', drawing: 'draw-413.jpg', photos: ['photo-413-1.jpg', 'photo-413-2.jpg'] },
        { name: 'Модель 450', size: '450×380×180 мм', drawing: 'draw-450.jpg', photos: ['photo-450-1.jpg'] },
        { name: 'Модель 500', size: '500×380×180 мм', drawing: 'draw-500.jpg', photos: [] },
        { name: 'Модель 422', size: '350×380×180 мм', drawing: 'draw-422.jpg', photos: [] },
        { name: 'Модель 390', size: '500×380×180 мм (овальная)', drawing: 'draw-390.jpg', photos: [] },
        { name: 'Модель 388', size: '380×380×180 мм (круглая)', drawing: 'draw-388.jpg', photos: [] },
        { name: 'Модель 304', size: '170×380×140 мм', drawing: 'draw-304.jpg', photos: [] },
        { name: 'Модель K', size: 'Индивидуальный размер', drawing: 'draw-K.jpg', photos: [] }
      ]
    },
    {
      title: 'Панель приставная',
      models: [{ name: 'Панель П-1', size: 'Размеры', drawing: 'draw-panel-1.jpg', photos: [] }]
    },
    {
      title: 'Панель интегрированная',
      models: [{ name: 'Панель И-1', size: 'Размеры', drawing: 'draw-integ-1.jpg', photos: [] }]
    },
    {
      title: 'Обнижение, проточки',
      models: [{ name: 'Обнижение О-1', size: 'Размеры', drawing: 'draw-obn-1.jpg', photos: [] }]
    },
    {
      title: 'Подоконники',
      models: [{ name: 'Подоконник П-1', size: 'Размеры', drawing: 'draw-podok-1.jpg', photos: [] }]
    },
    {
      title: 'Виды плинтуса',
      models: [
        { 
          name: 'Галтель', 
          size: 'Укажите размеры', 
          drawing: 'draw-plint-1.jpg', 
          photos: [] 
        },
        { 
          name: 'Приставной плинтус', 
          size: 'Укажите размеры', 
          drawing: 'draw-plint-2.jpg', 
          photos: [] 
        },
        { 
          name: 'Интегрированный плинтус', 
          size: 'Укажите размеры', 
          drawing: 'draw-plint-3.jpg', 
          photos: [] 
        }
      ]
    }
  ];

  let currentCat = 0, currentModel = 0, currentPhoto = 0;
  const tabsEl = document.getElementById('tabs'), stripEl = document.getElementById('modelStrip');
  const drawEl = document.getElementById('drawing'), infoEl = document.getElementById('info');
  const photoEl = document.getElementById('photo'), counterEl = document.getElementById('counter');
  const btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext');
  const photoBox = document.getElementById('photoBox');
  const dotsEl = document.getElementById('dots');

  function renderTabs() {
    tabsEl.innerHTML = '';
    DATA.forEach((cat, i) => {
      const btn = document.createElement('div');
      btn.className = 'tab' + (i === currentCat ? ' active' : '');
      btn.textContent = cat.title;
      btn.onclick = () => { 
        currentCat = i; currentModel = 0; currentPhoto = 0; 
        renderTabs(); renderModels(); updateView(); 
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderModels() {
    stripEl.innerHTML = '';
    DATA[currentCat].models.forEach((model, i) => {
      const div = document.createElement('div');
      div.className = 'model-thumb' + (i === currentModel ? ' active' : '');
      const img = document.createElement('img');
      img.src = model.drawing;
      img.onerror = () => { img.style.display = 'none'; div.innerHTML = `<span>${model.name.replace('Модель ', '').substring(0, 8)}</span>`; };
      div.appendChild(img);
      div.onclick = () => { currentModel = i; currentPhoto = 0; renderModels(); updateView(); div.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); };
      stripEl.appendChild(div);
    });
  }

  function updateView() {
    const model = DATA[currentCat].models[currentModel];
    if (!model) {
      drawEl.src = ''; infoEl.textContent = 'Модели скоро появятся';
      photoEl.src = ''; photoEl.style.display = 'none';
      btnPrev.classList.remove('show'); btnNext.classList.remove('show'); 
      counterEl.classList.remove('show'); dotsEl.classList.remove('show');
      return;
    }

    drawEl.src = model.drawing;
    infoEl.textContent = `${model.name} · ${model.size}`;
    dotsEl.innerHTML = ''; 
    
    if (model.photos && model.photos.length > 0) {
      photoEl.style.display = 'block';
      photoEl.src = model.photos[currentPhoto] + '?v=' + new Date().getTime();
      
      if (model.photos.length > 1) {
        btnPrev.classList.add('show'); btnNext.classList.add('show');
        counterEl.classList.add('show'); counterEl.textContent = `${currentPhoto + 1} / ${model.photos.length}`;
        dotsEl.classList.add('show');
        model.photos.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'dot' + (i === currentPhoto ? ' active' : '');
          dotsEl.appendChild(dot);
        });
      } else {
        btnPrev.classList.remove('show'); btnNext.classList.remove('show'); counterEl.classList.remove('show'); dotsEl.classList.remove('show');
      }
    } else {
      photoEl.src = ''; photoEl.alt = 'Живые фото скоро появятся';
      btnPrev.classList.remove('show'); btnNext.classList.remove('show'); counterEl.classList.remove('show'); dotsEl.classList.remove('show');
    }
  }

  function changePhoto(dir) {
    const model = DATA[currentCat].models[currentModel];
    if (!model || !model.photos || model.photos.length <= 1) return;
    currentPhoto = (currentPhoto + dir + model.photos.length) % model.photos.length;
    updateView();
  }

  btnPrev.onclick = () => changePhoto(-1);
  btnNext.onclick = () => changePhoto(1);

  let touchStartX = 0;
  photoBox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, {passive: true});
  photoBox.addEventListener('touchend', e => {
    const touchEndX = e.changedTouches[0].clientX;
    if (touchEndX < touchStartX - 30) changePhoto(1);
    if (touchEndX > touchStartX + 30) changePhoto(-1);
  }, {passive: true});

  renderTabs(); renderModels(); updateView();
</script>
</body>
</html>

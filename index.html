<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Азбука Акрила — Каталог</title>

<!-- Иконка для браузера и для телефона -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<!-- Настройки для телефона (открывается как приложение) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Азбука">

<style>
  /* Светлая тема */
  :root{ 
    --bg: #f4f6f4;      
    --panel: #ffffff;   
    --accent: #559c51;  
    --accent-light: #6bb867; 
    --text: #1a1c19;    
    --muted: #6c706c; 
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  
  body{
    background:var(--bg); color:var(--text); 
    height: 100vh; 
    height: 100dvh; 
    display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  
  /* ===== ШАПКА ===== */
  .header { padding: 12px 15px 8px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .site-logo { height: 45px; width: auto; object-fit: contain; margin-bottom: 10px; }

  .tabs { 
    display: flex; gap: 8px; justify-content: flex-start; margin-top: 5px; 
    overflow-x: auto; padding-bottom: 5px; padding-left: 5px; padding-right: 5px;
    width: 100%; 
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap;
    border: 1px solid #d0d4d0; background: transparent;
    color: var(--muted); font-size: 13px; transition: all 0.3s ease;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; box-shadow: 0 4px 12px rgba(85, 156, 81, 0.3); }

  .sub-tabs {
    display: none; gap: 8px; justify-content: flex-start; margin-top: 8px;
    overflow-x: auto; padding-bottom: 2px; padding-left: 5px; padding-right: 5px;
    width: 100%; animation: fadeIn 0.3s ease;
  }
  .sub-tabs.show { display: flex; }
  .sub-tabs::-webkit-scrollbar { display: none; }
  .sub-tab {
    padding: 5px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
    border: 1px solid transparent; background: #e4e7e4;
    color: var(--text); font-size: 12px; transition: all 0.3s ease;
  }
  .sub-tab.active { background: rgba(85, 156, 81, 0.15); color: var(--accent); font-weight: 600; border: 1px solid var(--accent); }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== ОСНОВНОЙ БЛОК ===== */
  .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 8px 12px; gap: 10px; overflow: hidden; }
  
  .drawing-box {
    background: #fff; border-radius: 12px; padding: 6px 10px; 
    height: 20vh; 
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    flex-shrink: 0; position: relative;
    border: 1px solid #e0e3e0; 
    border-top: 4px solid var(--accent); 
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: height 0.3s ease; 
  }
  .drawing-img { width: 100%; height: calc(100% - 20px); object-fit: contain; }
  .drawing-info { text-align: center; color: #1a1c19; font-size: 14px; font-weight: 700; width: 100%; line-height: 1.1; padding-top: 4px; }
  
  .photo-box {
    background: #111; border-radius: 12px; flex-grow: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2a2c26;
  }
  .photo-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  
  /* --- РЕЖИМЫ ОТОБРАЖЕНИЯ --- */
  .main-content.single-view .photo-box { display: none !important; }
  .main-content.single-view .drawing-box { height: 100%; flex-grow: 1; padding: 20px 15px; border-top: 1px solid #e0e3e0; border-top-width: 6px; border-top-color: var(--accent); }
  .main-content.single-view .drawing-img { height: calc(100% - 30px); }

  .main-content.photo-only .drawing-box { display: none !important; }
  .main-content.photo-only .photo-box { width: 100%; height: 100%; }

  /* МАЛЕНЬКИЕ СТРЕЛКИ */
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
    background: rgba(0, 0, 0, 0.4); border: none; border-radius: 50%; color: #fff;
    font-size: 16px; cursor: pointer; display: none; align-items: center; justify-content: center;
    z-index: 10; transition: all 0.2s; backdrop-filter: blur(2px);
  }
  .nav-btn:active { background: rgba(0, 0, 0, 0.8); }
  .nav-btn.show { display: flex; }
  .nav-prev { left: 8px; }
  .nav-next { right: 8px; }
  
  .photo-counter {
    position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
    color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 8px; display: none; z-index: 10;
  }
  .photo-counter.show { display: block; }
  .dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; z-index: 10; }
  .dots.show { display: flex; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: background 0.3s; }
  .dot.active { background: var(--accent); }

  /* ===== ЛЕНТА МОДЕЛЕЙ ===== */
  .model-strip {
    flex-shrink: 0; 
    padding: 12px 12px calc(30px + env(safe-area-inset-bottom)); 
    display: flex; gap: 12px; overflow-x: auto;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    background: var(--panel); border-top: 1px solid #e0e3e0;
  }
  .model-strip::-webkit-scrollbar { display: none; }
  
  .model-thumb {
    flex: 0 0 70px; height: 70px; 
    border-radius: 10px; background: #f4f6f4;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s ease; overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .model-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .model-thumb.active { 
    border-color: var(--accent); 
    background: #fff;
    transform: translateY(-2px); 
    box-shadow: 0 4px 10px rgba(85, 156, 81, 0.25); 
  }
  .model-thumb span { font-size: 12px; color: #333; font-weight: 700; text-align: center; line-height: 1.1; }

  /* ===== ДЕСКТОПНАЯ ВЕРСИЯ ===== */
  @media (min-width: 768px) {
    .site-logo { height: 70px; } 
    .tabs, .sub-tabs { justify-content: center; }
    .main-content { flex-direction: row; padding: 20px; gap: 20px; height: calc(100vh - 170px); }
    
    .drawing-box { width: 25%; height: 100%; padding: 15px 10px; border-top: 1px solid #e0e3e0; border-left: 6px solid var(--accent); } 
    .drawing-info { font-size: 16px; }
    
    .photo-box { width: 75%; height: 100%; }
    
    .main-content.single-view .drawing-box { width: 100%; border-left: none; border-top: 6px solid var(--accent); }
    .main-content.photo-only .photo-box { width: 100%; height: 100%; }
    
    .model-strip { padding: 15px 20px; justify-content: center; border-radius: 16px; margin: 0 20px 20px; border: 1px solid #e0e3e0; }
    .model-thumb { flex: 0 0 80px; height: 80px; }
    
    .nav-btn { width: 36px; height: 36px; font-size: 18px; background: rgba(0,0,0,0.5); }
    .nav-btn:hover { background: var(--accent); }
  }
</style>
</head>
<body>

  <div class="header">
    <img src="logo.png" alt="Азбука Акрила" class="site-logo" onerror="this.style.display='none'; document.getElementById('text-title').style.display='block';">
    <div id="text-title" style="display:none; font-size: 22px; font-weight: 600; margin-bottom: 10px; color: var(--accent);">Азбука Акрила</div>
    
    <div class="tabs" id="tabs"></div>
    <div class="sub-tabs" id="subTabs"></div>
  </div>

  <div class="main-content" id="mainContent">
    <div class="drawing-box" id="drawingBox">
      <img id="drawing" class="drawing-img" src="" alt="Чертеж">
      <div id="info" class="drawing-info"></div>
    </div>

    <div class="photo-box" id="photoBox">
      <img id="photo" class="photo-img" src="" alt="Фото">
      <div id="counter" class="photo-counter"></div>
      <div id="dots" class="dots"></div>
      <button class="nav-btn nav-prev" id="btnPrev">‹</button>
      <button class="nav-btn nav-next" id="btnNext">›</button>
    </div>
  </div>

  <div class="model-strip" id="modelStrip"></div>

<script>
  const DATA = [
    {
      title: 'Мойки',
      subcats: [
        {
          name: 'Для ванной',
          models: [
            { name: 'Модель 201', drawing: 'draw-201.jpg', photos: ['photo-201-1.jpg', 'photo-201-2.jpg', 'photo-201-3.jpg'] },
            { name: 'Модель 202', drawing: 'draw-202.jpg', photos: ['photo-202-1.jpg', 'photo-202-2.jpg', 'photo-202-3.jpg'] },
            { name: 'Модель 203', drawing: 'draw-203.jpg', photos: ['photo-203-1.jpg', 'photo-203-2.jpg', 'photo-203-3.jpg'] },
            { name: 'Модель 206', drawing: 'draw-206.jpg', photos: ['photo-206-1.jpg', 'photo-206-2.jpg', 'photo-206-3.jpg'] },
            { name: 'Модель 205', drawing: 'draw-205.jpg', photos: ['photo-205-1.jpg', 'photo-205-2.jpg', 'photo-205-3.jpg'] },
            { name: 'Модель 205L', drawing: 'draw-205L.jpg', photos: ['photo-205L-1.jpg', 'photo-205L-2.jpg', 'photo-205L-3.jpg'] }, 
            { name: 'Модель 210', drawing: 'draw-210.jpg', photos: ['photo-210-1.jpg', 'photo-210-2.jpg', 'photo-210-3.jpg'] },
            { name: 'Модель 211', drawing: 'draw-211.jpg', photos: ['photo-211-1.jpg', 'photo-211-2.jpg', 'photo-211-3.jpg'] },
            { name: 'Модель КК', drawing: 'draw-KK.jpg', photos: ['photo-KK-1.jpg', 'photo-KK-2.jpg', 'photo-KK-3.jpg'] }
          ]
        },
        {
          name: 'Для кухни',
          models: [
            { name: 'Модель 300', drawing: 'draw-300.jpg', photos: ['photo-300-1.jpg', 'photo-300-2.jpg', 'photo-300-3.jpg'] },
            { name: 'Модель 413', drawing: 'draw-413.jpg', photos: ['photo-413-1.jpg', 'photo-413-2.jpg', 'photo-413-3.jpg'] },
            { name: 'Модель 450', drawing: 'draw-450.jpg', photos: ['photo-450-1.jpg', 'photo-450-2.jpg', 'photo-450-3.jpg'] },
            { name: 'Модель 500', drawing: 'draw-500.jpg', photos: ['photo-500-1.jpg', 'photo-500-2.jpg', 'photo-500-3.jpg'] },
            { name: 'Модель 380', drawing: 'draw-380.jpg', photos: ['photo-380-1.jpg', 'photo-380-2.jpg', 'photo-380-3.jpg'] },
            { name: 'Модель K', drawing: 'draw-K.jpg', photos: ['photo-K-1.jpg', 'photo-K-2.jpg', 'photo-K-3.jpg'] }
          ]
        },
        {
          name: 'Виды моек', hideStrip: true,
          models: [
            { 
              name: 'Мойка на заказ', 
              drawing: '', 
              photos: [
                'photo-custom-1-1.jpg', 'photo-custom-1-2.jpg', 'photo-custom-1-3.jpg',
                'photo-custom-1-4.jpg', 'photo-custom-1-5.jpg', 'photo-custom-1-6.jpg',
                'photo-custom-1-7.jpg', 'photo-custom-1-8.jpg', 'photo-custom-1-9.jpg',
                'photo-custom-1-10.jpg'
              ] 
            }
          ]
        }
      ]
    },
    {
      title: 'Панели',
      subcats: [
        {
          name: 'Приставная', hideStrip: true,
          models: [{ name: 'Панель приставная', drawing: 'draw-panel-1.jpg', photos: [] }]
        },
        {
          name: 'Интегрированная', hideStrip: true,
          models: [{ name: 'Панель интегрированная', drawing: 'draw-integ-1.jpg', photos: [] }]
        }
      ]
    },
    {
      title: 'Виды бортиков',
      subcats: [
        {
          name: 'Все',
          models: [
            { name: 'Галтель', drawing: 'draw-plint-1.jpg', photos: [] },
            { name: 'Приставной', drawing: 'draw-plint-2.jpg', photos: [] },
            { name: 'Интегрированный', drawing: 'draw-plint-3.jpg', photos: [] }
          ]
        }
      ]
    },
    {
      title: 'Виды кромок',
      subcats: [
        {
          name: 'Все',
          models: [
            { name: 'Фигурная', drawing: 'draw-kromka-1.jpg', photos: [] },
            { name: 'R8 (Радиус 8 мм)', drawing: 'draw-kromka-2.jpg', photos: [] },
            { name: 'R5 (Радиус 5 мм)', drawing: 'draw-kromka-3.jpg', photos: [] },
            { name: 'R3 (Радиус 3 мм)', drawing: 'draw-kromka-4.jpg', photos: [] },
            { name: '45 градусов', drawing: 'draw-kromka-5.jpg', photos: [] },
            { name: 'Не проливайка (Защитный бортик)', drawing: 'draw-kromka-6.jpg', photos: [] }
          ]
        }
      ]
    },
    {
      title: 'Обнижение и проточки',
      subcats: [
        {
          name: 'Все',
          models: [
            { name: 'Проточки', drawing: 'draw-obn-1.jpg', photos: [] },
            { name: 'Обнижение и проточки', drawing: 'draw-obn-2.jpg', photos: [] },
            { name: 'Проточки для конвекции воздуха', drawing: 'draw-obn-3.jpg', photos: [] }
          ]
        }
      ]
    },
    {
      title: 'Полки',
      subcats: [
        {
          name: 'Все',
          models: [
            { name: 'Полка П-1', drawing: 'draw-shelf-1.jpg', photos: ['photo-shelf-1-1.jpg', 'photo-shelf-1-2.jpg', 'photo-shelf-1-3.jpg'] }
          ]
        }
      ]
    }
  ];

  let currentCat = 0, currentSubCat = 0, currentModel = 0, currentPhoto = 0;
  
  const tabsEl = document.getElementById('tabs');
  const subTabsEl = document.getElementById('subTabs');
  const stripEl = document.getElementById('modelStrip');
  const mainContentEl = document.getElementById('mainContent');
  const drawingBoxEl = document.getElementById('drawingBox');
  const drawEl = document.getElementById('drawing'), infoEl = document.getElementById('info');
  const photoEl = document.getElementById('photo'), counterEl = document.getElementById('counter');
  const btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext');
  const photoBox = document.getElementById('photoBox');
  const dotsEl = document.getElementById('dots');

  function renderTabs() {
    tabsEl.innerHTML = '';
    DATA.forEach((cat, i) => {
      const btn = document.createElement('div');
      btn.className = 'tab' + (i === currentCat ? ' active' : '');
      btn.textContent = cat.title;
      btn.onclick = () => { 
        currentCat = i; 
        currentSubCat = 0; 
        currentModel = 0; 
        currentPhoto = 0; 
        renderTabs(); 
        renderSubTabs(); 
        renderModels(); 
        updateView(); 
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderSubTabs() {
    subTabsEl.innerHTML = '';
    const subcats = DATA[currentCat].subcats;
    
    if (subcats.length > 1) {
      subTabsEl.classList.add('show');
      subcats.forEach((sub, i) => {
        const btn = document.createElement('div');
        btn.className = 'sub-tab' + (i === currentSubCat ? ' active' : '');
        btn.textContent = sub.name;
        btn.onclick = () => {
          currentSubCat = i;
          currentModel = 0;
          currentPhoto = 0;
          renderSubTabs();
          renderModels();
          updateView();
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        };
        subTabsEl.appendChild(btn);
      });
    } else {
      subTabsEl.classList.remove('show');
    }
  }

  function renderModels() {
    stripEl.innerHTML = '';
    const subcat = DATA[currentCat].subcats[currentSubCat];
    
    if (subcat.hideStrip || !subcat.models || subcat.models.length <= 1) {
      stripEl.style.display = 'none';
      return;
    } else {
      stripEl.style.display = 'flex';
    }

    subcat.models.forEach((model, i) => {
      const div = document.createElement('div');
      div.className = 'model-thumb' + (i === currentModel ? ' active' : '');
      
      const img = document.createElement('img');
      if (model.drawing) {
        img.src = model.drawing;
        img.onerror = () => { img.style.display = 'none'; div.innerHTML = `<span>${model.name}</span>`; };
        div.appendChild(img);
      } else {
        div.innerHTML = `<span>${model.name}</span>`;
      }

      div.onclick = () => { currentModel = i; currentPhoto = 0; renderModels(); updateView(); div.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); };
      stripEl.appendChild(div);
    });
  }

  function updateView() {
    const models = DATA[currentCat].subcats[currentSubCat].models || [];
    const model = models[currentModel];
    
    if (!model) {
      drawEl.src = ''; infoEl.textContent = 'Модели скоро появятся';
      photoEl.src = ''; 
      mainContentEl.className = 'main-content single-view';
      return;
    }

    mainContentEl.className = 'main-content';
    dotsEl.innerHTML = ''; 
    infoEl.textContent = model.name; 

    const hasDrawing = model.drawing && model.drawing.trim() !== '';
    const hasPhotos = model.photos && model.photos.length > 0;

    if (hasDrawing) {
      drawingBoxEl.style.display = 'flex';
      drawEl.src = model.drawing;
    } else {
      drawingBoxEl.style.display = 'none';
    }

    if (hasPhotos) {
      photoBox.style.display = 'flex';
      photoEl.style.display = 'block';
      photoEl.src = model.photos[currentPhoto] + '?v=' + new Date().getTime();
      
      if (model.photos.length > 1) {
        btnPrev.classList.add('show'); btnNext.classList.add('show');
        counterEl.classList.add('show'); counterEl.textContent = `${currentPhoto + 1} / ${model.photos.length}`;
        dotsEl.classList.add('show');
        model.photos.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'dot' + (i === currentPhoto ? ' active' : '');
          dotsEl.appendChild(dot);
        });
      } else {
        btnPrev.classList.remove('show'); btnNext.classList.remove('show'); counterEl.classList.remove('show'); dotsEl.classList.remove('show');
      }
    } else {
      photoBox.style.display = 'none';
      photoEl.src = ''; 
      btnPrev.classList.remove('show'); btnNext.classList.remove('show'); 
      counterEl.classList.remove('show'); dotsEl.classList.remove('show');
    }

    if (hasDrawing && !hasPhotos) {
      mainContentEl.classList.add('single-view'); 
    } else if (!hasDrawing && hasPhotos) {
      mainContentEl.classList.add('photo-only'); 
    }
  }

  function changePhoto(dir) {
    const models = DATA[currentCat].subcats[currentSubCat].models || [];
    const model = models[currentModel];
    if (!model || !model.photos || model.photos.length <= 1) return;
    currentPhoto = (currentPhoto + dir + model.photos.length) % model.photos.length;
    updateView();
  }

  btnPrev.onclick = () => changePhoto(-1);
  btnNext.onclick = () => changePhoto(1);

  let touchStartX = 0;
  photoBox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, {passive: true});
  photoBox.addEventListener('touchend', e => {
    const touchEndX = e.changedTouches[0].clientX;
    if (touchEndX < touchStartX - 30) changePhoto(1);
    if (touchEndX > touchStartX + 30) changePhoto(-1);
  }, {passive: true});

  renderTabs(); 
  renderSubTabs();
  renderModels(); 
  updateView();
</script>
</body>
</html>
